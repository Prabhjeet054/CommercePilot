services:
  postgres:
    image: postgres:16
    container_name: commercepilot-postgres
    environment:
      POSTGRES_USER: commercepilot
      POSTGRES_PASSWORD: commercepilot
      POSTGRES_DB: commercepilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commercepilot -d commercepilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: commercepilot-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://commercepilot:commercepilot@postgres:5432/commercepilot
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: phase3-dev-access-secret-change-me
      JWT_REFRESH_SECRET: phase3-dev-refresh-secret-change-me
      COOKIE_SECURE: "false"
      LLM_PROVIDER: openai
      LLM_PROVIDER_API_KEY: replace-me
      APPROVAL_TTL_MINUTES: "15"
      RAZORPAY_KEY_ID: rzp_test_replace_me
      RAZORPAY_KEY_SECRET: replace-me
      RAZORPAY_WEBHOOK_SECRET: replace-me
      PAYMENT_RECONCILE_TIMEOUT_SECONDS: "60"
      PAYMENT_RECONCILE_MAX_ATTEMPTS: "3"
      PAYMENT_RECONCILE_BACKOFF_MS: "1000,4000,16000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    container_name: commercepilot-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
